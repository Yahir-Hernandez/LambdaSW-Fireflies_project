{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <title>Nueva contraseña – Festival de Luciernagas</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/user/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/user/registro.css' %}">
</head>
<body>
  <section class="hero auth-hero">
    <div class="auth-split">
      <div class="auth-panel">
        <div class="card">
          <div class="card-body">
            <h2 class="auth-dialog__title">Nueva contraseña</h2>
            <hr>
            <p style="font-size:.9rem;color:var(--text-dim);margin-bottom:1.6rem;">
              Elige una contraseña segura de al menos 8 caracteres.
            </p>

            {% if error %}
              <div class="alert alert-danger" role="alert" style="font-size:.85rem;">{{ error }}</div>
            {% endif %}

            <form method="post" class="auth-form" style="display:flex;flex-direction:column;gap:18px;" id="reset-confirm-form">
              {% csrf_token %}

              <div>
                <label class="form-label" for="id_password1">Nueva contraseña</label>
                <div class="pw-field-wrap">
                  <input type="password" name="password1" id="id_password1" class="form-control" required minlength="8" autocomplete="new-password">
                  <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" data-target="id_password1">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>

              <div>
                <label class="form-label" for="id_password2">Confirmar contraseña</label>
                <div class="pw-field-wrap">
                  <input type="password" name="password2" id="id_password2" class="form-control" required minlength="8" autocomplete="new-password">
                  <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" data-target="id_password2">
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
                <p id="pw-match-hint" class="form-text" style="min-height:1.2em;"></p>
              </div>

              <div class="auth-form__actions">
                <span></span>
                <button type="submit" class="btn btn-success">Guardar contraseña</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="auth-visual" aria-hidden="true">
        <div class="hero__stars"></div>
        <div class="hero__fireflies">
          <span class="ff" style="--dx: 16px; --dy: -20px; --dur: 3.2s; left: 18%; top: 20%;"></span>
          <span class="ff" style="--dx: -18px; --dy: 14px; --dur: 3.6s; left: 72%; top: 28%;"></span>
          <span class="ff" style="--dx: 10px; --dy: -16px; --dur: 2.8s; left: 84%; top: 54%;"></span>
          <span class="ff" style="--dx: -20px; --dy: 10px; --dur: 4.1s; left: 30%; top: 72%;"></span>
          <span class="ff" style="--dx: 12px; --dy: -14px; --dur: 3.4s; left: 55%; top: 78%;"></span>
          <span class="ff" style="--dx: -14px; --dy: 18px; --dur: 3.9s; left: 8%; top: 60%;"></span>
        </div>
        <img src="{% static 'img/logo_b.png' %}" alt="Logo del Festival" class="logo"/>
      </div>
    </div>
  </section>
  <script src="{% static 'script/luciernagas.js' %}"></script>
  <script>
  // Mostrar/ocultar contraseña
  document.querySelectorAll('.pw-toggle').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const input = document.getElementById(btn.dataset.target);
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.querySelector('i').className = isText ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    });
  });

  // Hint de coincidencia en tiempo real
  const p1 = document.getElementById('id_password1');
  const p2 = document.getElementById('id_password2');
  const hint = document.getElementById('pw-match-hint');
  function checkMatch() {
    if (!p2.value) { hint.textContent = ''; hint.style.color = ''; return; }
    if (p1.value === p2.value) {
      hint.textContent = '✓ Las contraseñas coinciden';
      hint.style.color = 'var(--accent)';
    } else {
      hint.textContent = '✗ Las contraseñas no coinciden';
      hint.style.color = '#e74c3c';
    }
  }
  p1.addEventListener('input', checkMatch);
  p2.addEventListener('input', checkMatch);
  </script>
</body>
</html>
