{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <title>Contraseña actualizada – Festival de Luciérnagas</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/user/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/user/registro.css' %}">
  <style>
    /* Forzar centrado del botón, por si otros CSS lo alinean a la izquierda */
    .btn-centered {
      display: inline-block !important;
      text-align: center !important;
      vertical-align: middle;
      min-width: 220px;
      padding: 12px 24px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  <section class="hero auth-hero">
    <div class="auth-split">
      <div class="auth-panel">
        <div class="card">
          <div class="card-body" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:24px;">
            <h2 class="auth-dialog__title" style="margin:0; font-size: 2.2rem;">¡Contraseña actualizada!</h2>
            <p style="color:var(--text-dim); font-size: 1.1rem; max-width: 400px; line-height: 1.6;">
              Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'sistema_app:login' %}" class="btn btn-success btn-centered">
              Iniciar sesión
            </a>
          </div>
        </div>
      </div>

      <div class="auth-visual" aria-hidden="true">
        <div class="hero__stars"></div>
        <div class="hero__fireflies">
          <span class="ff" style="--dx: 16px; --dy: -20px; --dur: 3.2s; left: 18%; top: 20%;"></span>
          <span class="ff" style="--dx: -18px; --dy: 14px; --dur: 3.6s; left: 72%; top: 28%;"></span>
          <span class="ff" style="--dx: 10px; --dy: -16px; --dur: 2.8s; left: 84%; top: 54%;"></span>
          <span class="ff" style="--dx: -20px; --dy: 10px; --dur: 4.1s; left: 30%; top: 72%;"></span>
          <span class="ff" style="--dx: 12px; --dy: -14px; --dur: 3.4s; left: 55%; top: 78%;"></span>
          <span class="ff" style="--dx: -14px; --dy: 18px; --dur: 3.9s; left: 8%; top: 60%;"></span>
        </div>
        <img src="{% static 'img/logo_b.png' %}" alt="Logo del Festival" class="logo"/>
      </div>
    </div>
  </section>
  <script src="{% static 'script/luciernagas.js' %}"></script>
</body>
</html>
