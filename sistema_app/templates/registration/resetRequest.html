{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <title>Recuperar contraseña – Festival de Luciernagas</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/user/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/user/registro.css' %}">
</head>
<body>
  <section class="hero auth-hero">
    <div class="auth-split">
      <div class="auth-panel">
        <div class="card">
          <div class="card-body">
            <h2 class="auth-dialog__title">Recuperar contraseña</h2>
            <hr>
            <p class="auth-form__intro">
              Ingresa el correo asociado a tu cuenta y te enviaremos un código de verificación.
            </p>

            <form method="post" class="auth-form auth-form--stack" data-loader>
              {% csrf_token %}
              <div>
                <label class="form-label" for="id_email">Correo electrónico</label>
                <input
                  type="email"
                  name="email"
                  id="id_email"
                  class="form-control"
                  placeholder="tu@correo.com"
                  required
                  autofocus
                >
              </div>

              <div class="auth-form__actions">
                <a class="btn btn--ghost btn--sm auth-form__back" href="{% url 'sistema_app:login' %}">
                  <i class="fa-solid fa-arrow-left"></i> Volver
                </a>
                <button type="submit" class="btn btn-success">Enviar código</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      {% include "partials/auth_visual.html" %}
    </div>
  </section>
  <script src="{% static 'script/luciernagas.js' %}"></script>
  <script src="{% static 'script/loader.js' %}"></script>
</body>
</html>
