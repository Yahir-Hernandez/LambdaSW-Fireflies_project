{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <title>Contraseña actualizada – Festival de Luciérnagas</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/user/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/user/registro.css' %}">
</head>
<body>
  <section class="hero auth-hero">
    <div class="auth-split">
      <div class="auth-panel">
        <div class="card">
          <div class="card-body card-body--centered">
            <h2 class="auth-dialog__title">¡Contraseña actualizada!</h2>
            <p class="auth-form__intro">
              Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión con tu nueva contraseña.
            </p>
            <a href="{% url 'sistema_app:login' %}" class="btn btn-success auth-cta">
              Iniciar sesión
            </a>
          </div>
        </div>
      </div>

      {% include "partials/auth_visual.html" %}
    </div>
  </section>
  <script src="{% static 'script/luciernagas.js' %}"></script>
</body>
</html>
