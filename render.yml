databases:
  - name: luciernagas-db
    plan: free
    databaseName: luciernagas2026
    user: luciernagas2026

services:
  - type: web
    name: luciernagas2026
    runtime: python
    plan: free
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn luciernagas2026.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: USE_WHITENOISE_STORAGE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: luciernagas-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: sistema_app.email_backends.SendGridEmailBackend
      - key: EMAIL_IMAGE_MODE
        value: remote
      - key: SENDGRID_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
